<div class="split-container" [ngClass]="{'resizing-active': isResizing}">
  <!-- Left Panel - Terminal -->
  <div class="panel terminal-panel" [style.width.px]="leftPanelWidth" [ngClass]="{'full-width': !isAIPanelVisible}">
    <div class="panel-content">
      <!-- Terminal Tabs -->
      <div class="terminal-tabs">
        <div class="tabs-container">
          <app-terminal-tab
            *ngFor="let session of terminalSessions; trackBy: trackBySessionId"
            [session]="session"
            [canClose]="terminalSessions.length > 1"
            (select)="switchToSession($event)"
            (close)="closeSession($event)"
          ></app-terminal-tab>
          <button class="new-tab" (click)="createNewSession(undefined, true)" title="New tab">
            +
          </button>
          <button
            class="ai-panel-toggle"
            (click)="toggleAIPanel()"
            [title]="isAIPanelVisible ? 'Hide AI panel' : 'Show AI panel'"
          >
            <app-icon [name]="isAIPanelVisible ? 'ai-panel-visible' : 'ai-panel-hidden'" [size]="16"></app-icon>
          </button>
        </div>
      </div>

      <div class="output-area terminal-output-area">
        <div class="xterm-wrapper" #terminalContainer></div>
      </div>
    </div>
  </div>

  <!-- Resizer - Only show when AI panel is visible -->
  <div class="resizer" (mousedown)="startResize($event)" (touchstart)="startResize($event)"
    [class.resizing]="isResizing" *ngIf="isAIPanelVisible">
  </div>

  <!-- Right Panel - AI Chat - Only show when isAIPanelVisible is true -->
  <div class="panel ai-panel" *ngIf="isAIPanelVisible">
    <div class="panel-content">
      <div class="ai-panel-header">
        <div class="ai-view-tabs">
          <button
            class="ai-view-tab"
            [class.active]="activeAiView === 'chat'"
            (click)="setActiveAiView('chat')"
          >
            Chat
          </button>
          <button
            class="ai-view-tab"
            [class.active]="activeAiView === 'settings'"
            (click)="setActiveAiView('settings')"
          >
            Settings
          </button>
        </div>
        <div class="current-model" [title]="currentLLMModel || 'No model selected'">
          {{ currentLLMModel || 'No model selected' }}
        </div>
      </div>

      <div class="output-area" *ngIf="activeAiView === 'chat'">
        <div class="chat-history">
          <div *ngFor="let entry of chatHistory; trackBy: trackByChatEntry" class="chat-entry">
            <!-- Add question display -->
            <div class="chat-question">
              <span class="message"><b>{{ entry.message }}</b></span>
            </div>
            <div class="chat-output">
              <ng-container *ngFor="let segment of entry.response.split('\n'); trackBy: trackByResponseSegment">
                <!-- Check if segment is a code block placeholder -->
                <ng-container *ngIf="isCodeBlockPlaceholder(segment) && entry.codeBlocks">
                  <!-- Get the index of the code block -->
                  <ng-container *ngIf="getCodeBlockIndex(segment) >= 0">
                    <!-- Simple command display -->
                    <div class="command-block">
                      <div class="command-content">
                        <span class="simple-command">
                          <span class="command-text">
                            {{ transformCodeForDisplay(entry.codeBlocks[getCodeBlockIndex(segment)].code) }}
                          </span>
                          <span class="command-actions">
                            <button class="command-action-button" data-tooltip="Copy"
                              (click)="copyCodeBlock(entry.codeBlocks[getCodeBlockIndex(segment)].code)">
                              <app-icon name="copy" [size]="12"></app-icon>
                            </button>
                            <button class="command-action-button" data-tooltip="Copy to terminal"
                              (click)="sendCodeToTerminal(entry.codeBlocks[getCodeBlockIndex(segment)].code)">
                              <app-icon name="copy-to-terminal" [size]="12"></app-icon>
                            </button>
                            <button class="command-action-button" data-tooltip="Execute"
                              (click)="executeCodeDirectly(entry.codeBlocks[getCodeBlockIndex(segment)].code)">
                              <app-icon name="execute" [size]="12"></app-icon>
                            </button>
                          </span>
                        </span>
                        <span class="command-explanation"
                          *ngIf="getCommandExplanation(entry.codeBlocks[getCodeBlockIndex(segment)].code)">
                          {{ getCommandExplanation(entry.codeBlocks[getCodeBlockIndex(segment)].code) }}
                        </span>
                      </div>
                    </div>
                  </ng-container>
                </ng-container>

                <!-- Regular text lines -->
                <div *ngIf="!isCodeBlockPlaceholder(segment)" [innerHTML]="sanitizeHtml(segment)"></div>
              </ng-container>
            </div>
          </div>
        </div>
      </div>

      <div class="settings-view output-area" *ngIf="activeAiView === 'settings'">
        <div class="settings-section">
          <label class="settings-label" for="apiBaseUrl">OpenAI Compatible Base URL</label>
          <input
            id="apiBaseUrl"
            class="settings-input"
            type="url"
            [(ngModel)]="aiApiBaseUrl"
            placeholder="https://api.openai.com/v1"
            spellcheck="false"
          />
        </div>

        <div class="settings-section">
          <label class="settings-label" for="apiKey">API Key</label>
          <input
            id="apiKey"
            class="settings-input"
            type="password"
            [(ngModel)]="aiApiKey"
            placeholder="sk-..."
            spellcheck="false"
          />
        </div>

        <div class="settings-section">
          <label class="settings-label" for="currentModel">Model</label>
          <input
            id="currentModel"
            class="settings-input"
            type="text"
            [(ngModel)]="currentLLMModel"
            placeholder="gpt-4.1-mini"
            spellcheck="false"
          />
        </div>

        <div class="settings-section" *ngIf="availableModels.length > 0">
          <label class="settings-label" for="modelList">Loaded Models</label>
          <select
            id="modelList"
            class="settings-input"
            [ngModel]="currentLLMModel"
            (ngModelChange)="onModelSelected($event)"
          >
            <option *ngFor="let model of availableModels" [value]="model">{{ model }}</option>
          </select>
        </div>

        <div class="settings-actions">
          <button class="settings-button" type="button" (click)="loadAvailableModels()" [disabled]="isLoadingModels">
            {{ isLoadingModels ? 'Loading...' : 'Load Models' }}
          </button>
          <button class="settings-button primary" type="button" (click)="saveAiSettings()">
            Save
          </button>
        </div>

        <div class="settings-status" *ngIf="aiSettingsStatus">
          {{ aiSettingsStatus }}
        </div>
      </div>

      <div class="input-area" *ngIf="activeAiView === 'chat'">
        <div class="prompt-container">
          <textarea [(ngModel)]="currentQuestion" (keydown)="askAI($event)" (input)="autoResize($event)"
            [disabled]="isProcessingAI" placeholder="Ask AI or type /help..." autofocus spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
